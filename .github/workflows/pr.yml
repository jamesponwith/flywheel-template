# Validate: no green, no merge. M1 = lint + unit; component suite lands in M2.
# AI review runs locally in the pre-push hook (see lefthook.yml + docs/adr/0002), not here.
name: pr

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # -race by default: CI caught a race the local suite never hit, which is
      # the entire argument for running it here.
      - run: go test -race ./...

  # Facts, not judgement: the pre-push security lens reasons about the code,
  # this checks what is verifiably true about secrets and dependencies.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: secrets
        # Blocking. A committed secret is already leaked; failing loudly is the
        # only useful response.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: vulnerabilities
        # Advisory until the noise level is known — a gate that cries wolf gets
        # bypassed, and a bypassed gate is worse than none (ADR 0001).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found issues — triage into a bead"
